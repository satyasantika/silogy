# Vhost untuk menumpangkan silogy.unsil.ac.id pada reverse proxy silaris-frontend.
#
# Server ns93: silaris-frontend (container nginx) memegang port 80+443 dan
# me-route berdasarkan Host. Tambahkan blok ini agar Host silogy.unsil.ac.id
# di-forward ke container nginx silogy (di-bind pada 172.17.0.1:8081).
#
# CARA PASANG (lihat docs/DEPLOYMENT_VPS.md §Reverse proxy):
#   1. Sediakan sertifikat origin untuk silogy.unsil.ac.id di
#      /opt/lpmpp-fe/nginx/ssl/silogy-fullchain.pem & silogy-privkey.pem
#      (Let's Encrypt via certbot ATAU Cloudflare Origin Certificate).
#   2. Salin file ini ke /opt/lpmpp-fe/nginx/conf.d/silogy.conf DAN pastikan
#      Dockerfile silaris-frontend meng-COPY-nya (atau mount), lalu rebuild
#      + restart container silaris-frontend.
#
# Catatan: silogy di belakang Cloudflare (mode Full/Full-strict). Cloudflare
# menerminasi TLS publik; blok 443 di sini melayani koneksi Cloudflare→origin.

server {
    listen 80;
    server_name silogy.unsil.ac.id;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name silogy.unsil.ac.id;

    ssl_certificate     /etc/nginx/ssl/silogy-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/silogy-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Filament/Livewire + upload (php.ini silogy = 32M)
    client_max_body_size 32m;

    location / {
        proxy_pass http://172.17.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/silogy-access.log;
    error_log  /var/log/nginx/silogy-error.log;
}
