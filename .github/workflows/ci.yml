name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Push ke main tidak boleh saling menyalip (job deploy di bawah menjalankan
# migrasi di server). PR boleh dibatalkan bila ada push baru — hemat runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: silogy_test
          MYSQL_USER: silogy
          MYSQL_PASSWORD: silogy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PHP 8.4 — bukan 8.3. composer.lock mengunci paket (mis. symfony/error-handler
      # v8.0.8) yang butuh php >=8.4, sama seperti runtime produksi (php:8.4-fpm-alpine).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, mbstring, intl, bcmath, gd, zip, sodium
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Migrasi dijalankan di MySQL — skema yang sebenarnya dipakai produksi.
      # Migrasi kurikulum_id (2026_07_27_080000) punya cabang khusus non-SQLite
      # (ALTER ... MODIFY ... NOT NULL) yang hanya teruji di sini.
      - name: Migrate (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: silogy_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # Test memakai SQLite in-memory sesuai phpunit.xml, sama dengan yang
      # dijalankan pengembang di lokal.
      #
      # UTANG PARITAS: suite ini belum lolos di MySQL (237 gagal). Sebabnya
      # cpl/bok/mk/mk_units ber-kurikulum_id NOT NULL di MySQL tapi tetap
      # nullable di SQLite, dan sebagian fixture tidak mengisinya. Selama itu
      # belum dibereskan, menjadikan MySQL sebagai gerbang berarti tidak ada
      # rilis yang bisa jalan sama sekali.
      - name: Test
        run: php artisan test --parallel

  # Build aset diverifikasi di CI, bukan baru ketahuan rusak saat build image di
  # server. Node 22 mengikuti stage `assets` di .docker/php/Dockerfile.prod
  # (Vite 8 butuh Node ^20.19 || >=22.12).
  assets:
    name: Build aset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  deploy:
    name: Deploy ke produksi
    runs-on: ubuntu-latest
    needs: [quality, assets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Deploy tidak boleh dibatalkan di tengah jalan (migrasi + recreate container).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: https://silogy.unsil.ac.id

    steps:
      # Skrip rilis diambil dari repo yang baru saja di-reset di server, bukan
      # dari salinan manual di ~/docker-apps/deploy.sh — supaya perubahan
      # prosedur deploy ikut ter-versioning dan tidak perlu disalin tangan.
      - name: Rilis via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/docker-apps/silogy
            git fetch --prune origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
