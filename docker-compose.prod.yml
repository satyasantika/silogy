# SILOGY — Compose PRODUKSI.
#
# Beda utama vs docker-compose.yml (dev):
#   - Kode & asset DI-BAKE ke image (Dockerfile.prod), bukan mount source.
#   - Tanpa mailpit; SMTP asli lewat .env.
#   - Port MySQL & Redis TIDAK diekspos ke publik (hanya jaringan internal).
#   - nginx hanya di-publish ke 127.0.0.1 → di depannya reverse proxy host
#     (Apache/Nginx) yang menerminasi SSL. Lihat docs/DEPLOYMENT_VPS.md.
#   - restart: unless-stopped di semua service.
#
# Nilai DB/Redis/MySQL diambil dari .env Laravel (satu sumber kebenaran).
#
# Jalankan:  docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile.prod
    image: silogy-app:prod
    container_name: silogy_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      RUN_RELEASE: "1"          # container ini menjalankan migrate + cache saat start
    volumes:
      - public_assets:/var/www/html/public   # dibagi ke nginx (disinkron dari image saat start)
      - storage_app:/var/www/html/storage/app/public  # file upload persisten
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.26-alpine
    container_name: silogy_nginx
    restart: unless-stopped
    ports:
      # Bind ke docker0 gateway saja (bukan publik). silaris-frontend nginx
      # me-route Host silogy.unsil.ac.id → http://172.17.0.1:8081 (pola yang
      # sama dipakai silaris untuk backend di 172.17.0.1:9001).
      - "172.17.0.1:${APP_PORT:-8081}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    image: silogy-app:prod
    container_name: silogy_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      RUN_RELEASE: "0"          # worker TIDAK menjalankan migrate/cache
    command: ["php", "artisan", "queue:work", "redis", "--queue=cpl-calculation,ai-analysis,default", "--tries=3", "--timeout=300", "--sleep=3", "--max-time=3600"]
    volumes:
      - storage_app:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: silogy_mysql
    restart: unless-stopped
    # Tanpa `ports:` — hanya jaringan internal compose. Akses dari host lewat `docker compose exec`.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD di .env}
      MYSQL_DATABASE: ${DB_DATABASE:-silogy_prod}
      MYSQL_USER: ${DB_USERNAME:-silogy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/silogy.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: silogy_redis
    restart: unless-stopped
    # Tanpa `ports:` — internal saja.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  public_assets:
  storage_app:
